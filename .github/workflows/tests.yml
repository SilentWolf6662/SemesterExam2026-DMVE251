# Denne workflow kører tests og publicerer resultater på Pull Requests mod main-branchen
name: Run tests and publish results on PRs

on:
  pull_request:
    branches:
      - main # Workflow kører kun når der laves Pull Request mod main
      - developer

# Giver workflow de nødvendige rettigheder til at læse repo og skrive testresultater i Pull Requestens kommentarer
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  run-tests:
    name: Run tests
    # Kører alt på en Ubuntu maskine (GitHub-hosted)
    runs-on: ubuntu-latest 

    steps:
      # Henter repository kode så workflow kan arbejde med det
      - name: Checkout code
        uses: actions/checkout@v4

      # Installerer .NET SDK (her version 10.x for at matche at vi bruger .NET 10 i projektet)
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      # Gendanner / Tilføjer NuGet dependencies
      - name: Restore dependencies
        run: dotnet restore

      # Bygger solution i Release mode (springer restore over, da det allerede er gjort)
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Opretter mappe til test output (TRX filer)
      - name: Create test results directory
        run: mkdir -p TestResults

      # Kører domain tests og gemmer resultat i TRX-format i TestResults mappen 
      # for at vi kan publicere det senere i en kommentar på pull request
      # continue-on-error sikrer at workflow fortsætter selv hvis tests fejler
      # (så vi stadig kan publicere resultater)
      - name: Run Domain tests
        run: >
          dotnet test --project
          tests/BookRight.Domain.Tests/BookRight.Domain.Tests.csproj
          --configuration Release --results-directory TestResults
          --report-xunit-trx --report-xunit-trx-filename Domain.trx
        continue-on-error: true

      # Kører use case tests separat for bedre opdeling i rapportering
      - name: Run UseCase Tests
        run: >
          dotnet test --project
          tests/BookRight.UseCases.Tests/BookRight.UseCases.Tests.csproj
          --configuration Release --results-directory TestResults
          --report-xunit-trx --report-xunit-trx-filename UseCases.trx
        continue-on-error: true

      # Publicerer testresultater til Pull Request som checks / annotations (kommentarer)
      # if: always() sikrer at dette step kører selv hvis tests fejler
      - name: Publish test results
        if: always()
        # Action der tager testresultater i TRX format og publicerer dem som checks (kommentarer) på Pull Requesten
        uses: EnricoMi/publish-unit-test-result-action@v2.23.0 
        with:
          files: "TestResults/**/*.trx"
